name: postbasefl
description: >-
  The official Dart/Flutter client for Postbase — a self-hosted,
  open-source backend as a service built on PostgreSQL. REST query
  builder, auth, storage, and RLS support for Flutter and plain Dart.
version: 0.1.1
homepage: https://www.getpostbase.com
repository: https://github.com/harshalone/postbasefl
issue_tracker: https://github.com/harshalone/postbasefl/issues
topics:
  - postbase
  - backend
  - database
  - auth
  - storage

environment:
  sdk: ^3.4.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.0
  app_links: ^6.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  mocktail: ^1.0.4
  lints: ^4.0.0
